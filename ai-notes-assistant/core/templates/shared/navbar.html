<nav
    aria-label="Main navigation"
    style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:16px 5%; background:#fff; border-bottom:1px solid #e6eaf1;"
>
    <a
        href="{% url 'dashboard' %}"
        style="font-weight:700; color:#182338; text-decoration:none;"
    >
        AI Notes Assistant
    </a>

    <div style="display:flex; flex-wrap:wrap; align-items:center; gap:16px;">
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'material_list' %}">My Materials</a>
            <a href="{% url 'summary_list' %}">Summaries</a>
            <a href="{% url 'quiz_list' %}">Quizzes</a>
            <a href="{% url 'flashcard_list' %}">Flashcards</a>
            <a href="{% url 'chat_page' %}">Chat</a>

            <form
                method="post"
                action="{% url 'account_logout' %}"
                style="display:inline; margin:0;"
            >
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'account_login' %}">Sign in</a>
            <a href="{% url 'account_signup' %}">Sign up</a>
        {% endif %}
    </div>
</nav>
